<!DOCTYPE HTML>
<html>
<head>
    <title>Disk stats WebSocket test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script type="text/javascript" charset="utf-8">
        document.addEventListener("DOMContentLoaded", function () {
            // `path` selects the endpoint; the namespace stays the default one.
            // Do NOT set addTrailingSlash: false - engine.io matches the path with
            // a trailing slash and would answer 404 without it.
            const socket = io("http://localhost:8080", {
                path: "/ws/disk_stats",
                transports: ["websocket"],
                query: { disks: "iscsi-hdd/disk1,iscsi-ssd/disk2" },
            });

            const log = (text) => {
                const item = document.createElement("li");
                item.textContent = text;
                document.getElementById("log").appendChild(item);
            };

            socket.on("connect", () => {
                document.getElementById("status").textContent = "Connected";
            });

            socket.on("connect_error", (err) => {
                document.getElementById("status").textContent = "Error: " + err.message;
            });

            socket.on("disconnect", () => {
                document.getElementById("status").textContent = "Disconnected";
            });

            // Pushed by the server every WS_STATS_INTERVAL seconds, no polling needed.
            socket.on("disk_stats_response", (data) => log(JSON.stringify(data)));
            socket.on("response", (data) => log(JSON.stringify(data)));
            socket.on("pong", () => log("pong"));

            // Changing the subscribed disks without reconnecting
            document.getElementById("subscribe").addEventListener("click", () => {
                const disks = document.getElementById("disks").value;
                socket.emit("subscribe", { disks: disks });
            });
        });
    </script>
</head>
<body>
    <p>Status: <span id="status">Disconnected</span></p>
    <input id="disks" size="60" value="iscsi-hdd/disk1,iscsi-ssd/disk2" />
    <button id="subscribe">Subscribe</button>
    <ul id="log"></ul>
</body>
</html>
