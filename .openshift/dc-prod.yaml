kind: DeploymentConfig
apiVersion: apps.openshift.io/v1
metadata:
  name: storage-api
  labels:
    app: storage-api
spec:
  replicas: 1
  selector:
    app: storage-api
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: storage-api
    spec:
      containers:
        - env:
            - name: STORAGE_CONF
              value: /etc/ceph/storage.conf
          image: docker.zby.icdc.io/icdc/storage-api:prod
          imagePullPolicy: Always
          name: storage-api
          ports:
            - containerPort: 8888
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - mountPath: /etc/ceph
              name: ceph-config
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: ceph-config
          secret:
            defaultMode: 420
            secretName: storage-api
  test: false
  triggers:
    - type: ConfigChange
