  # @DS: reviewed 2024-02-08
  /s3/users/{id}/keys:
    # @DS: reviewed 2024-02-08
    post:
      operationId: s3.users.keys.regenerate
      tags: [S3]
      summary: Regenerate keys for S3 Protocol
      description: >
        Regenerate S3 user access and secret keys used in S3 protocol.  
        This endpoint can be useful if lost access to keys or they have been compromised.  

        Currently, S3 user may have only one credential per protocol:  
         - one pair of S3 keys
         - one key for Swift protocol
        
        Keys are stored inside S3 user object.  
        S3 user object has owner user (identified by email).  

        #### Role-based access
          - `member` can regenerate keys for own s3users.
          - `owner`\`admin` can regenerate keys of other s3users in authorized account
          - `operator` can regenerate keys on behalf of other s3users in any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: S3 user for object storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'

