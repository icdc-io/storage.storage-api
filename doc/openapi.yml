openapi: 3.0.1
info:
  title: ICDC Storage API
  description: >
    # Introduction
    
    The `Storage` service provides easy HTTP API to manage **Object Storage** (aka S3 buckets) and **iSCSI Block Storage** functionality of ICDC Cloud Platform.  
    Using this API you can script the complex actions that are required for your business case.  
    The API documentation starting from general overview and followed by reference information on specific endpoints.
    
    ## Object Storage
    
    **Object Storage** is a technology based on OpenSource `Ceph` project.  

    This functionality allows to create special `s3 user` accounts with the purpose of accessing buckets and store objects into the buckets.  
    Access can be provided with two protocols:
    - Amazon S3-compatible Protocol
    - Openstack Swift protocol

    ## iSCSI Block Storage

    This functionality allows to create iSCSI Disks (backed by RBD disk protocol) and iSCSI Clients (consumer devices).  
    iSCSI Clients (identified by IQN) can connect through iSCSI Portals (aka iSCSI Gateways, hosted on CloudGateway VM)
    and get access to assigned iSCSI Disks (which are RBD disk on shared `Ceph` cluster).

  version: 2.0.2
  contact:
    email: support@icdc.io
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - description: Public URL
    url: https://api.{loc}.icdc.io/api/storage/v2
    variables:
      loc:
        default: dcz.lab
        description: 3-letter code of location
  - description: Location-local URL
    url: http://storage.cloud-storage.svc:3000/api/v2
  - description: Local development URL
    url: http://localhost:8080/api/v2
tags:
  - name: Account
    description: Management for Resource Namespaces (aka Accounts)
  - name: S3
    description: S3 service management
  - name: iSCSI
    description: iSCSI service management
  - name: Pool
    description: Pool management

security:
  - JWT:
    # There is list of roles, not scopes:
    - operator
    - owner
    - admin
    - member
    Account: []
    Role: []
  - basicAuth: []
    Account: []
    Role: []
paths:

  # @DS: reviewed 2024-01-26
  /accounts:
    post:
      operationId: accounts.create
      tags:
        - Account
        - Private
      summary: Creates account
      description: >
        This the internal endpoint used by Setup-API.    
        By sending request to this endpoint you can create account and configures it with minimum usable state.  

        It help to configure:
          - Quotas for each pool and each service
          - Assign iSCSI Config records
          - Assign iSCSI Gateway records  

        At the moment, Setup-API starts initialization:
          - Knows info which CloudGateway(s) are connected to account networks;
          - Connects to CloudGateway(s) and configures them:
            - Configured config file name (e.g. *<acc>_default.conf*) in CloudGateway(s);
            - Assigns pool name (e.g. *iscsi-ssd*);
          - Knows default credentials to internal iSCSI Gateway API (port :5000);
          - Knows portal's IP address and API's IP address;  

        As of Setup-API knows relationships between iSCSI Gateway (running on CloudGateway) and Pool (storage type),
        it can pass all required information to this endpoint to create iSCSI Config and iSCSI Gateway records.    

        Setup-API knows pool names, so it has to request list of pools (see endpoint `/pools`) to find out `pool_id` used in this endpoint.  

        #### Role-based access
          - `operator` role can send requests to the endpoint
          - other roles does have to access the endpoint
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account_Create'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      operationId: accounts.list
      tags:
        - Account
        - Private
      summary: List all accounts
      description: >
        List all accounts configured in Storage service  

        #### Role-based access
          - `operator` role has full access
          - other roles does have to the endpoint
      responses:
        '200':
          $ref: '#/components/responses/Account_List'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # @DS: reviewed 2024-02-14
  /accounts/{account}:
    put:
      operationId: accounts.update
      tags:
        - Account
        - Private
      summary: Update account (or re-setup)
      description: >
        This the internal endpoint used by Setup-API.  

        By sending request to this endpoint you can update account and re-setup account services.  

        Re-setup used when account was badly configured or new feature introduced which requires reconfiguration of account objects (e.g. iSCSI Cluster or iSCSI Gateways).
        Check POST /accounts endpoint for more information.  
        
        #### Role-based access
          - `operator` role can send requests to the endpoint
          - other roles does have access to the endpoint
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account_Create'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account_Ref'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'
    delete:
      operationId: accounts.delete
      tags:
        - Account
        - Private
      summary: Delete (un-register) specific account
      description: >
        Delete specific account including:
         - Remove iSCSI disks and clients
         - Remove S3 users
         - Remove S3 buckets
         - Remove quotas
         - Remove account entry (last step)
        
        As it can take long time it should put deleting task in queue and process such long tasks by separate thread (or process).  

        #### Role-based access
          - `operator` role can delete any account
          - other roles does have access to the endpoint
      responses:
        '204':
          description: "Deleted"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # @DS: reviewed 2024-12-03
  /s3/limits:
    # @DS: reviewed 2024-12-03
    get:
      operationId: s3.limits.list
      tags: [Account]
      summary: List account S3 per-pool limit-sets
      description: >-
        List account's S3 per-pool limit-sets (which limits quotas)  

        LimitSet object shares the same structure as QuotaSet.  

        #### Role-based access
          - all roles have read access to limit-sets of the authorized account
          - `operator` gets limits for all accounts
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        '200':
          $ref: '#/components/responses/S3_LimitSet_List'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # @DS: reviewed 2024-12-03
  /s3/quotas:
    # @DS: reviewed 2024-12-03
    get:
      operationId: s3.quotas.list
      tags: [Account]
      summary: List account S3 per-pool quota-sets
      description: >-
        List account's S3 per-pool quota-sets.  
        Account may not have quota-sets for some pools.  

        #### Role-based access
          - all roles have read access to quota sets of the authorized account
          - `operator` can get quotas for all accounts
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        '200':
          $ref: '#/components/responses/S3_QuotaSet_List'
        '401':
          $ref: '#/components/responses/Unauthorized'
    # @DS: reviewed 2024-01-26
    post:
      operationId: s3.quotas.create
      tags: [Account]
      summary: Set up S3 per-pool quota set
      description: >-
        The endpoint allows to create S3 QuotaSet for specific pool for specific account.  

        Only one account quota can be configured for specific pool.  
        Throws `409 Conflict` if tried to install another quota for account per pool.  
        `account_name` attribute is optional, if not specified current authorized account is used.  

        #### Role-based access
          - `owner`, `admin` roles can create quotas of the authorized account
          - authorized `operator` can create quota for any account
      # @DS: quota is going to be a billable metric, so may be restrict to be changed only by owner?
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
      requestBody:
        description: S3 Quota info
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3_Quota'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3_Quota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  # @DS: reviewed 2024-02-09
  /s3/quotas/{id}:
    # @DS: reviewed 2024-02-09
    # @DS: reviewed 2024-07-18, renamed from: /accounts/{account}/s3/quotas/{id}
    put:
      operationId: s3.quotas.update
      tags: [Account]
      summary: Modify account S3 quota
      description: >-
        Modify account's S3 quota set for specific pool.  
        Modifing quota can not change pool it's connected, so `pool_id` attribute should be ignored.  

        #### Role-based access
          - `owner`, `admin` roles can create quotas of the authorized account
          - authorized `operator` can create quota for any account
      # @DS: quota is going to be a billable metric, so may be restrict to be changed only by owner?
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        description: New values for S3 Quota, may be partial
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3_Quota'
      responses:
        '200':
          description: Updated S3 Quota quota values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3_Quota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': #
          $ref: '#/components/responses/Notfound'
    delete:
      operationId: s3.quotas.delete
      tags: [Account]
      summary: Delete account S3 quota
      description: >-
        Delete account's S3 quota for the specific pool.  
        Deleting quota means refusing to use resources of the specific pool.  
        All buckets and objects should be deleted before deleting quota.  

        #### Role-based access
          - `owner` role can delete quotas of the authorized account
          - authorized `operator` can delete quota for any account
      # @DS: quota is going to be a billable metric, so may be restrict to be changed only by owner?
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'

  # @DS: reviewed 2024-12-03
  /iscsi/limits:
    # @DS: reviewed 2024-12-03
    get:
      operationId: iscsi.limits.list
      tags: [Account]
      summary: List account S3 per-pool limit-sets
      description: >-
