      tags: [iSCSI]
      summary: Assign existing iSCSI Disks to the specific iSCSI client
      description: >-
        With this endpoint multiple iSCSI disks multiple can be assigned to the ISCSI client (aka consumer device).  
        Basically multiple disks can be assigned to multiple clients.  
        Client and disks records are created and managed by end-users.  
        Client has one owner user. Disk has one owner user.  

        Effectively owner\admin can assign disk of one user to another user's client.  
        User which owns the client can later resign its own client from specific disk.  

        #### Role-based access
          - `member` can assign own disks to own client.
          - `owner`\`admin` can assign any disks to any client in authorized account
          - `operator` can assign any disk in to any client (both must be in the same account) in any account
      security:
