    # @DS: reviewed 2024-02-02
    Snapshot:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
          example: 71
        name:
          type: string
          example: snapshot name
        description:
          type: string
          example: description
        size_gb:
          readOnly: true
          description: >-
            Snapshot size (basically) can increase over the time.
            This happens because of nature of snapshots - they are just difference in blocks,
            and difference between actual write layer and snapshoted layer blocks can increase over the time
          type: integer
          example: 120
        creation_time:
          readOnly: true
          type: string
          example: "2000-01-23T04:56:07.000+00:00"
        disk_id:
          readOnly: true
          description: >-
            Parent iSCSI (RBD) disk which the snapshot related to
          type: string
          example: 61
