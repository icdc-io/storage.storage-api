  ###########################
  ##   iSCSI Endpoints     ##
  ###########################

  # @DS: reviewed 2025-10-08
  /iscsi/clusters:
    # @DS: reviewed 2025-10-08
    get:
      operationId: iscsi.clusters.list
      tags: [iSCSI]
      summary: List account iSCSI Clusters
      description: >-
        List of accessible iSCSI Clusters with iSCSI Gateways and iSCSI Target connected.  

        iSCSI Cluster is an account-owned entity that groups:
          - iSCSI Gateways
          - iSCSI Targets (and corresponding storage pool)
          - Disks (LUNs)
          - Clients (client machine id)  

        Constraints & scope:
          - A cluster may contain any number of gateways and any number of targets.
          - Each iSCSI Target is bound to exactly one storage pool (one target → one pool).
          - There is no owner user for an iSCSI Cluster; it’s an account-owned access level object.  

        #### Role-based access
          - all roles can read access to cluster of the authorized account
          - `operator` can get clusters for any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      responses:
        '200':
          $ref: '#/components/responses/iSCSI_Cluster_List'
        '401':
          $ref: '#/components/responses/Unauthorized'
    # @DS: reviewed 2024-02-02
    post:
      operationId: iscsi.clusters.create
      tags: [iSCSI]
      summary: Create new iSCSI Clusters.
      description: >-
        Create new iSCSI Clusters in database.  

        iSCSI Cluster is an account-owned configuration boundary that groups:
          - iSCSI Gateways
          - iSCSI Targets
          - Disks (LUNs)
          - Clients (client machine id)  

        Constraints & scope:
          - A cluster may contain any number of gateways and any number of targets.
          - Each iSCSI Target is bound to exactly one storage pool (one target → one pool).
          - There is no owner user for an iSCSI Cluster; it’s an account-owned access level object.  

        #### Role-based access
          - `operator` can create configs for any account
          - other roles can not create new iscsi configs
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        description: iSCSI Cluster
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iSCSI_Cluster'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iSCSI_Cluster'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # @DS: reviewed 2025-10-08
  /iscsi/clusters/{cluster_id}:
    # @DS: reviewed 2025-10-08
    get:
      operationId: iscsi.clusters.get
      tags: [iSCSI]
      summary: Get single iSCSI Cluster
      description: >-
        Get iSCSI Cluster with iSCSI Gateways and iSCSI Targets.  

        iSCSI Cluster is an account-owned entity that groups:
          - iSCSI Gateways
          - iSCSI Targets
          - Disks (LUNs)
          - Clients (client machine id)  

        Constraints & scope:
          - A cluster may contain any number of gateways and any number of targets.
          - Each iSCSI Target is bound to exactly one storage pool (one target → one pool).
          - There is no owner user for an iSCSI Cluster; it’s an account-owned access level object.  

        #### Role-based access
          - all roles can read access to cluster of the authorized account
          - `operator` can get clusters for any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - $ref: '#/components/parameters/ClusterId'
      responses:
        '200':
          description: iSCSI Cluster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/iSCSI_Cluster'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'
    # @DS: reviewed 2025-10-08
    delete:
      operationId: iscsi.clusters.delete
      tags: [iSCSI]
      summary: Delete single iSCSI Cluster by ID
      description: >
        Deletes iSCSI Cluster and all child records.  

        Constraints & scope:
          - Performs cascade deletion of all resources under the cluster.
          - DB-only removal: the Cluster, its iSCSI Gateways, and iSCSI Targets are deleted from the database.        
          - DB and Ceph teardown: iSCSI Disks(LUNs), iSCSI Client and Snapshots.  

        #### Role-based access
          - `operator` can delete configs for any account
          - other roles can not delete configs
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - $ref: '#/components/parameters/ClusterId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'

  # @DS: reviewed 2025-10-08
  /iscsi/gateways:
    # @DS: reviewed 2025-10-08
    post:
      operationId: iscsi.gateways.create
      tags: [iSCSI]
      summary: Create iSCSI gateway to iSCSI Cluster
      description: >-
        Register iSCSI Gateway (hosted on CloudGateway) to specific iSCSI cluster.  

        iSCSI Gateways are create by provisioning automation (Gateway API / Setup API) or manually operator users,
        and assigned to be part of the iSCSI Cluster during provisioning.  
        Gateways have no specific owner user, they are account-owner access level objects.  

        #### Role-based access
          - `operator` can assign gateway in any account
          - other roles can not assign gateways.
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        description: iSCSI Gateway
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Gateway'
      responses:
        '204':
          description: >
            No content.  
            We do not return created object as it's a child object of iSCSI cluster.
            Use iSCSI Cluster GET endpoint to get full cluster configuration with gateways.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': #
          $ref: '#/components/responses/Notfound'

  # @DS: reviewed 2025-10-08
  /iscsi/gateways/{gateway_id}:
    # @DS: reviewed 2025-10-08
    delete:
      operationId: iscsi.gateways.delete
      tags: [ iSCSI ]
      summary: delete iSCSI gateway to iSCSI Cluster
      description: >-
        Delete single iSCSI gateway.  

        #### Role-based access
          - `operator` can delete gateway in any account
          - other roles can not delete gateways.
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - $ref: '#/components/parameters/GatewayId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': #
          $ref: '#/components/responses/Notfound'

  # @DS: reviewed 2025-10-08
  /iscsi/targets:
    # @DS: reviewed 2025-10-08
    post:
      operationId: iscsi.targets.create
      tags:
        - iSCSI
      summary: Create new iSCSI target
      description: >-
        Create new iSCSI Targets in database.  

        Constraints & scope:
          - Each iSCSI Target is bound to exactly one storage pool (one target → one pool).
          - There is no owner user for an iSCSI Target; it’s an account-owned access level object.  

        #### Role-based access
          - `operator` can create iSCSI Target for any account
          - other roles can not create new iSCSI Targets
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        description: iSCSI Target
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/iSCSI_Target'
      responses:
        '204':
          description: >
            No content.
            iSCSI Target is child object for iSCSI Cluster.  
            Use iscsi.clusters.get endpoint to list active targets in the cluster.
        '401':
          $ref: '#/components/responses/Unauthorized'
  # @DS: reviewed 2025-10-08
  /iscsi/targets/{target_id}:
    # @DS: reviewed 2025-10-08
    delete:
      operationId: iscsi.targets.delete
      tags:
        - iSCSI
      summary: Delete single iSCSI Target by ID
      description: >-
        Deletes iSCSI Target and all child records.  

        Constraints & scope:
          - Performs cascade deletion of all resources under the cluster.
          - DB-only removal: iSCSI Targets is deleted from the database.        
