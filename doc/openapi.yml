  # @DS: reviewed 2024-12-09
  /s3/buckets:
    get:
      operationId: s3.buckets.list
      tags: [S3]
      summary: Get list of S3 buckets
      description: >
        Get list of `S3 Buckets`.  
        Each bucket is owned by single `s3user` entity (which holds access and secret keys).  
        `s3user` entity has owner user (responsible person identified by email).  

        #### Role-based access
          - `member` can get list of buckets of own s3user.
          - `owner`\`admin` can get list of buckets for all s3users in authorized account
          - `operator` can get list of buckets for all s3users in any account  

        Filtering:
          - `filter[user.name]` - filter by the name of related S3 user
          - `filter[user_name]` - (deprecated) filter by S3 user name
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: query
          name: filter[user.name]
          description: Filter by the name of related S3 user
          required: false
          schema:
            type: string
        - in: query
          name: filter[user_name]
          description: (deprecated) Filter by S3 user name
          required: false
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/S3_Bucket_List'
    post:
      operationId: s3.buckets.create
      tags: [S3]
      summary: Create S3 bucket for S3 user
      description: >
        Create S3 Bucket owned by specific S3 user.  
        Buckets are unique in account and can be created up to `s3user` quota.  
        S3 user object has owner user (identified by email).  

        #### Role-based access
          - `member` can create bucket and becomes owner of the bucket.
          - `owner`\`admin` can create buckets on behalf of other users in authorized account
          - `operator` can create buckets on behalf of other users in any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      requestBody:
        description: Create new Bucket
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bucket'
      responses:
        '200':
          description: S3 user for object storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bucket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404': #
          $ref: '#/components/responses/Notfound'
