                  description: List of quota for each pool, pool is referenced by name
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/S3_Quota'
                      - type: object
                        properties:
                          account:
                            writeOnly: true
                            description: Ignored as in the account already
                          endpoints:
                            writeOnly: true
                            description: Hide redundant information for account scope
                          limits:
                            writeOnly: true
                            description: Hide redundant information (not used in billing) for account scope
            iscsi:
              description: Initiate per-pool iSCSI quotas
              type: object
              properties:
                quotas:
                  description: List of quotas for each pool, pool is referenced by name
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/iSCSI_Quota'
                      - type: object
                        properties:
                          account:
                            writeOnly: true
                            description: Ignored as in the account already
                          target:
                            writeOnly: true
                            description: Hide redundant information for account scope
                          limits:
                            writeOnly: true
                            description: Hide redundant information (not used in billing) for account scope
                clusters:
                  description: >-
                    iSCSI cluster referenced by cluster name, e.g. cluster_f7e34dd
                    As well list of gateways by name to be initialized
                  type: array
                  items:
                    allOf:
                      - $ref: '#/components/schemas/iSCSI_Cluster'
                      - type: object
                        properties:
                          account:
                            writeOnly: true
                            description: Hide as in account scope already
                          targets:
                            type: array
                            items:
                              allOf:
                                - $ref: "#/components/schemas/iSCSI_Target"
                                - type: object
                                  properties:
                                    cluster:
                                      writeOnly: true
                                      description: Hide as in cluster scope already
                          gateways:
                            type: array
                            items:
                              allOf:
                                - $ref: "#/components/schemas/Gateway"
                                - type: object
                                  properties:
                                    cluster:
                                      writeOnly: true
                                      description: Hide as in cluster scope already
    # @DS: reviewed 2025-12-10
    Account_Create:
      description: >-
        Data required to create and activate new account
        Those parameters allows to one-shot configure all objects (quotas, clusters, targets, gateways)
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            services:
              description: Initiate parameters for sub-services
              type: object
              properties:
                s3:
                  description: Initiate per-pool S3 quotas
                  type: object
                  properties:
                    quotas:
                      description: List of quota for each pool, pool is referenced by name
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/S3_Quota'
                          - type: object
                            properties:
                              account_name:
                                readOnly: true
                                description: Ignored as creating in account scope
                iscsi:
                  description: Initiate per-pool iSCSI quotas
                  type: object
                  required:
                    - quotas
                    - clusters
                  properties:
                    quotas:
                      description: List of quotas for each pool, pool is referenced by name
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/iSCSI_Quota'
                          - type: object
                            properties:
                              account_name:
                                readOnly: true
                                description: Ignored as creating in account scope
                    clusters:
                      description: >-
                        iSCSI cluster referenced by cluster name, e.g. cluster_f7e34dd
                        As well list of gateways by name to be initialized
                      type: array
                      readOnly: false
                      items:
                        allOf:
                          - $ref: '#/components/schemas/iSCSI_Cluster'
                          - type: object
                            required:
                              - gateways
                              - targets
                            properties:
                              account_id:
                                readOnly: true
                                description: Ignored as creating in account scope
                              account_name:
                                readOnly: true
                                description: Ignored as creating in account scope
                              gateways:
                                description: >-
                                  List of gateway names to be created in cluster
                                type: array
                                readOnly: false
                                items:
                                  allOf:
                                    - $ref: "#/components/schemas/Gateway"
                                    - type: object
                                      properties:
                                        cluster_id:
                                          readOnly: true
                                          description: Ignored as creating in a new cluster scope
                              targets:
                                description: >-
                                  List of gateway names to be created in cluster
                                type: array
                                readOnly: false
                                items:
                                  allOf:
                                    - $ref: "#/components/schemas/iSCSI_Target"
                                    - type: object
                                      properties:
                                        cluster_id:
                                          readOnly: true
                                          description: Ignored as creating in a new cluster scope
    # @DS: reviewed 2024-01-29
    iSCSI_QuotaValue:
      description: >-
        Non-persistent object which is used to reference values in Quotas, Quota Limits and Quota Usage.
      type: object
      properties:
        clients:
          type: integer
          example: 100
        data_size_gb:
          type: integer
          example: 20000
        disks:
          type: integer
          example: 99
        snapshots:
          type: integer
          example: 55
    # @DS: reviewed 2024-01-29
    iSCSI_Quota:
      description: >-
        This is an object which describes account quota for some pool:
          - quota values
          - pool
          - limits
          - usage stats
          - target
      allOf:
        - $ref: '#/components/schemas/iSCSI_QuotaValue'
        - type: object
          properties:
            id:
              type: integer
              example: 34
              readOnly: true
            account_name:
              type: string
              example: acc1
              description: Global unique account name. Optional, if not specified current Subject account is used.
              writeOnly: true
            account:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/Account_Ref'
            pool_id:
              description: >-
                Configured only once during creation of quota.
              writeOnly: true
              type: integer
              example: 15
            pool:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/Pool'
            target:
              description: >-
                Target available for this quoted pools.
                Target are describes endpoints which are needed to connect to.
              type: array
              items:
                $ref: '#/components/schemas/iSCSI_Target'
            usage:
              description: >-
                Actual allocated disks and snapshots.
                Defines minimum value for changing quota
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/iSCSI_QuotaValue'
              - type: object
                properties:
                  snapshots_size_gb:
                    type: integer
                    example: 15
            limits:
              description: >-
                Limits are maximum values to which current quota values can be changed to.
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/iSCSI_QuotaValue'

    # @DS: reviewed 2025-10-08
    iSCSI_Cluster:
      type: object
      required:
        - name
      properties:
        id:
          readOnly: true
          type: integer
          example: 41
        name:
          description: >-
            Cluster name used on iSCSI gateways
          type: string
          example: cluster-1cdc0123
        account_id:
          writeOnly: true
          type: integer
          example: 99
        account_name:
          writeOnly: true
          description: >-
            Global unique account name. Alternative to account ID for referencing account.
            Optional, if not specified current Subject account is used.
          type: string
          example: acc1
        account:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/Account_Ref'
        targets:
          readOnly: true
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/iSCSI_Target'
              - type: object
                properties:
                  cluster:
                    writeOnly: true
                    description: Hide as in cluster scope already
        gateways:
          readOnly: true
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Gateway"
              - type: object
                properties:
                  cluster:
                    writeOnly: true
                    description: Hide as in cluster scope already

    # @DS: reviewed 2025-10-08
    iSCSI_Target:
      type: object
      required:
        - pool_id
      properties:
        id:
          readOnly: true
          type: integer
          example: 23
        iqn:
          readOnly: true
          description: >-
            Target name is generated by backend system from IQN prefix and pool name
          type: string
          example: iqn.2020-01.io.icdc.loc:iscsi-hdd
        cluster_id:
          writeOnly: true
          type: integer
          example: 41
        cluster_name:
          description: >-
            iSCSI Cluster name used to process the pool.
            Alternative way to set iSCSI Cluster for external systems (like Setup API)
            If not specified, then current least loaded cluster will be used.
          writeOnly: true
          type: string
          example: cluster-aaaa01234
        cluster:
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/iSCSI_Cluster'
        pool_id:
          writeOnly: true
          type: integer
          example: 7
        pool:
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/Pool'


    # @DS: reviewed 2024-02-06
    Gateway:
      type: object
      required:
        - name
