        Get details on technical S3/Swift user record which stores Access/Secret keys.  
        Each S3 user object has owner user (identified by email).  

        #### Role-based access
          - `member` can get list of own s3users.
          - `owner`\`admin` can get list of all s3users in authorized account
          - `operator` can get list of all s3users in any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: S3 user for object storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Notfound'
    # @DS: reviewed 2024-02-05
    put:
      operationId: s3.users.update
      tags: [S3]
      summary: Modify S3 user object
      description: >-
        Modify technical S3/Swift user record (`s3user`) which stores Access/Secret keys.  
        Each `s3user` object has owner user (identified by email).  

        #### Role-based access
          - `member` can modify only own `s3users`. Can not change `s3user` ownership.
          - `owner`\`admin` can modify any `s3users` in authorized account
          - `operator` can modify any `s3users` in any account
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        description: Update S3 user object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/S3_User'
      responses:
        '200':
          description: S3 user for object storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/S3_User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
