    S3_Endpoints:
      type: object
      properties:
        public:
          type: string
          example: "http://s3.dcz.lab.icdc.io/acc1, https://s3.dcz.lab.icdc.io/acc1"
        private:
          type: string
          example: "http://s3.local.dcz.lab.icdc.io/acc1, https://s3.local.dcz.lab.icdc.io/acc1"

    # @DS: reviewed 2026-03-05
    S3_User:
      type: object
      properties:
        id:
          readOnly: true
          type: integer
          example: 101
        name:
          description: >-
            S3 user name as stored in Ceph storage (full name with account prefix)
            For S3 users create in Storage V1 there can not be account prefix.
            Examples:
            - acc1$user1
            - acc2$user1
            - user3
          type: string
          example: acc1$user1
        description:
          type: string
          example: Application 1 User
        account:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/Account_Ref'
        status:
          type: string
          description: >-
            S3 user status, e.g. active, locked, deleted
            Set to locked to disable operations with S3 user without deleting it.
          example: active
        owner:
          type: string
          example: user@example.net
        pool:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/Pool'
        pool_id:
          writeOnly: true
          type: integer
          example: 13
        keys:
          readOnly: true
          description: >-
            Object storage credentials by used protocol
          oneOf:
          - $ref: '#/components/schemas/Keys'
        quota:
          $ref: '#/components/schemas/S3_User_Quota'
        usage:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/S3_User_Usage'

    # @DS: reviewed 2024-02-05
    S3_User_Quota:
      type: object
      properties:
        data_size_mb:
          description: >-
            Mapped into Ceph: s3user.user_quota.max_size(_kb)
          type: integer
          example: 4096
        objects:
          description: >-
            Mapped into Ceph: s3user.user_quota.max_objects
          type: integer
          example: 100
        buckets:
          description: >-
            Mapped into Ceph: s3user.max_buckets
          type: integer
          example: 65

    # @DS: reviewed 2024-11-05
    S3_User_Usage:
      type: object
      properties:
        data_size_mb:
          description: >-
            Retrieved from Ceph: s3user.usage.TotalBytes / 1.MiB
          type: integer
          example: 4096
        objects:
          description: >-
            Retrieved from Ceph: s3user.usage.TotalEntries
          type: integer
          example: 100
        buckets:
          description: >-
            Retrieved from Ceph: s3user.sum(buckets)
          type: integer
          example: 65

    # @DS: reviewed 2024-02-05
    Bucket:
      description: >-
        Buckets are not stored in database but in Ceph only, so buckets are identified by path (aka full bucket name)
      type: object
      properties:
        path:
          readOnly: true
          description: >-
            Full bucket name including account prefix, unique across Storage service
          type: string
          example: acc1/data-bucket
        name:
          description: >-
            Short bucket name, unique across account (and all account's s3users)
          type: string
          example: data-bucket
        quota:
          description: >-
            Quota for specific bucket
          $ref: "#/components/schemas/Bucket_Quota"
        # TODO @DS: may be return user object, which includes user.id and user.name.
        #           because we manipulate by s3user ID everywhere.
        user_name:
          description: >-
            S3 user which owns the bucket.
          type: string
          example: acc1$user1

    # @DS: reviewed 2024-02-05
    Bucket_Quota:
      description: >-
        Bucket-specific quota as defined in Ceph
      type: object
      properties:
        data_size_mb:
          description: >-
            Bucket-specific quota on data size, specified in MB
          type: integer
          example: 500
        objects:
          description: >-
            Bucket-specific quota on number of objects
          type: integer
          example: 30

    # @DS: reviewed 2024-02-06
    Keys:
      description: >-
        Object storage credentials stored by protocol
      type: object
      properties:
        swift:
          $ref: "#/components/schemas/Keys_Swift"
        s3:
          $ref: "#/components/schemas/Keys_S3"

    # @DS: reviewed 2024-02-06
    Keys_Swift:
      description: >-
        Swift protocol credential
      type: object
      properties:
        user:
          type: string
          example: acc1$user1:swift
        secret_key:
          type: string
          example: T6fOLwLIDJ8SEvj4RWrgbYAToIZztTeKfkFYqZh4

    # @DS: reviewed 2024-02-06
    Keys_S3:
      description: >-
        S3 protocol credential
      type: object
      properties:
        user:
          description: >-
            The name is the same as in S3 user
          type: string
          example: acc1$user1
        access_key:
          type: string
          example: T99JA8DRRC6SL7VLO02
        secret_key:
          type: string
          example: kZ03a3rB6s3hGBFLVUzawqnRsUAUN2Nbc6BofNWD

  parameters:
    Account:
      in: path
      name: account
      description: >-
        Name of the account, 5-symbols alphanumeric string
      required: true
      schema:
        type: string
      example: acc1
    ClusterId:
      in: path
      name: cluster_id
      description: >-
        ID of iSCSI cluster, as stored in Storage database
      required: true
      schema:
        type: integer
      example: 61
    GatewayId:
      in: path
      name: gateway_id
      description: >-
        ID of iSCSI Gateway, as stored in Storage database
      required: true
      schema:
        type: integer
      example: 88
    PoolId:
      in: path
      name: Pool_id
      required: true
      description: >-
        ID of iSCSI target, as stored in Storage database
      schema:
        type: integer
      example: 23
    DiskId:
      in: path
      name: disk_id
      description: >-
        ID of iSCSI Disk, as stored in Storage database
      required: true
      schema:
        type: integer
      example: 71
    ClientId:
      in: path
      name: client_id
      description: >-
        ID of iSCSI Client, as stored in Storage database
      required: true
      schema:
        type: integer
      example: 81

  securitySchemes:
    JWT:
      type: openIdConnect
      openIdConnectUrl: https://login.lab.icdc.io/realms/devel/.well-known/openid-configuration
    basicAuth:
        type: http
        scheme: basic
    Account:
      type: apiKey
      in: header
      #TODO: [DS] rename to x-auth-account
      name: x-auth-account
    Role:
      type: apiKey
      in: header
      #TODO: [DS] rename to x-auth-role
      name: x-auth-role
