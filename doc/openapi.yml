      operationId: iscsi.quotas.update
      tags: [iSCSI]
      summary: Modify account iSCSI quota
      description: >-
        Modify specific account's iSCSI quota for configured pools.  
        Modifing quota can not change pool it's connected, so `pool_id` attribute should be ignored.  

        #### Role-based access
          - `owner` can modify quotas in authorized account
          - `operator` can modify quota in any account
          - other roles can not modify quota
      security:
        - JWT: []
          Account: []
          Role: []
        - basicAuth: []
          Account: []
          Role: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        description: New values for iSCSI Quota, may be partial
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/iSCSI_Quota'
      responses:
        '200':
          description: Updated iSCSI quota values
