          writeOnly: true
          type: string
          example: StrongPassword
        cluster_id:
          writeOnly: true
          type: integer
          example: 41
        cluster:
          readOnly: true
          oneOf:
            - $ref: '#/components/schemas/iSCSI_Cluster'

