        Only one account quota can be configured for specific pool.  
        Throw `409 Conflict` if tried to install another quota for account per pool.  
        `account_name` attribute is optional, if not specified current authorized account is used.  

        #### Role-based access
          - `owner`, `admin` roles can create quotas of the authorized account
          - authorized `operator` can create quota for any account
      # TODO: @DS: quota is going to be a billable metric, so may be restrict to be changed only by owner?
