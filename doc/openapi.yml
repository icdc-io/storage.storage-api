          type: integer
          example: 10
        data_size_mb:
          description: Sum of space quota across all S3 users
          type: integer
          example: 10240
        buckets:
          description: Sum of bucket quota across all S3 users
          type: integer
          example: 20
        objects:
            description: Sum of objects quota across all S3 users
            type: integer
            example: 2000
    # @DS: reviewed 2024-01-26
    S3_Quota:
      description: >-
        This is an object which describes account quota for some pool:
          - quota values (attributes)
          - limits
          - usage stats
          - related account
          - related pool
          - endpoints
      allOf:
        - $ref: '#/components/schemas/S3_QuotaValue'
        - type: object
          properties:
            id:
              type: integer
              example: 33
              readOnly: true
            account_name:
              type: string
              example: acc1
              description: Global unique account name. Optional, if not specified current Subject account is used.
              writeOnly: true
            account:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/Account_Ref'
            pool_id:
              writeOnly: true
              type: integer
              example: 4
            pool:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/Pool'
            usage:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/S3_QuotaValue'
            limits:
              readOnly: true
              oneOf:
              - $ref: '#/components/schemas/S3_QuotaValue'
            endpoints:
              readOnly: true
