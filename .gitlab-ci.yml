stages:
  - build
  - audit
  - test

variables:
  LOG_FILE_NAME: $CI_COMMIT_SHORT_SHA.txt
  CR_SERVER: "artifactory.icz.icdc.io/icdc-docker-proxy"
  IMAGE_NAME: "storage"
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.28.0"

.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"
    - if: $CI_COMMIT_BRANCH == "dev"

build:
  stage: build
  tags:
    - testing
  script:
    - echo "Building the project..."
    - podman build --build-arg CR_SERVER=$CR_SERVER -t $IMAGE_NAME .
  <<: *default_rules

gitleaks:
  stage: audit
  tags: [testing]
  script:
    - mkdir -p output
    - >
      podman run --rm
      -v "$(pwd):/repo:Z" -w /repo
      "$GITLEAKS_IMAGE" detect
      --redact
      --no-banner
      --source=/repo
      --config /repo/.gitleaks.toml
      --report-format json
      --report-path /repo/output/gitleaks.json
  artifacts:
    when: always
    paths: [output/gitleaks.json]
    reports:
      secret_detection: output/gitleaks.json
  after_script:
    - podman stop -a || true
  <<: *default_rules

audit:
  stage: audit
  tags:
    - testing
  before_script:
    - mkdir -p ./output
  script:
    - echo "Running pip-audit..."
    - >
      podman run --rm
      --name storage
      --entrypoint /bin/sh
      -v "$(pwd)/output:/output:Z"
      "$IMAGE_NAME" -lc '
        set -e
        pip install -q pip-audit
        IGNORE_ARGS="$(sed "s/^/--ignore-vuln /" .pip-audit.ignore 2>/dev/null || true)"
        pip-audit --progress-spinner off $IGNORE_ARGS -o /output/pip_audit_report.txt
      '
  after_script:
    - podman stop -a || true
  artifacts:
    when: always
    paths:
      - output/pip_audit_report.txt
    expire_in: 1 week
  <<: *default_rules

tests:
  stage: test
  tags:
    - testing
    - dcz-sys
  before_script:
    - chmod +x ./run_tests.sh
    - mkdir htmlcov
    - touch report.xml
  script:
    - echo $LOG_FILE_NAME
    - ./run_tests.sh $IMAGE_NAME | tee -a $LOG_FILE_NAME
  after_script:
    - podman stop -a || true
    - podman rm -a || true
    - podman rmi $(podman images --filter "dangling=true" -q) || true
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - htmlcov
      - $LOG_FILE_NAME
    expire_in: 1 week
    reports:
      junit: report.xml
  <<: *default_rules
