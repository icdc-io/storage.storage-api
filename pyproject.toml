[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.8
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
#select = ["E4", "E7", "E9", "F", "I", "N", "ARG", "A"]
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["E401", "E402", "E501", "C901"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
minversion = "6.0"

addopts = [
    "-ra",
    "--cov=app",
    "--cov-report=html",
    "--cov-report=term"
]

testpaths = ["tests"]

python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    "ceph: marks tests that perform Ceph operations or require Ceph environment"
]

filterwarnings = []
log_cli = true
log_cli_level = "CRITICAL"
# disable_warnings = true

[tool.pylint]
[tool.pylint.typecheck]
# List of members which are set dynamically and missed by pylint inference
# system, and so shouldn't trigger E1101 when accessed. Python regular
# expressions are accepted.
generated-members = ["consts.*"]

[tool.pylint.messages_control]
disable = [
  # dubling Ruff signatures
  "line-too-long",          # C0301
  "trailing-whitespace",    # C0303
  "bad-indentation",        # W0311

  # dubling  Ruff (E4 + I) signatures
  "wrong-import-order",     # C0411
  "ungrouped-imports",      # C0412
  "wrong-import-position",  # C0413
  "multiple-imports",       # C0410

  #  Pyflakes/Ruff
  "unused-import",          # W0611 -> Ruff F401
  "unused-variable",        # W0612 -> Ruff F841
  "unused-argument",        # W0613 -> Ruff ARG001
  "redefined-outer-name",   # W0621 -> Ruff F811
  "redefined-builtin",      # W0622 -> Ruff A001/A002

  # Pyflakes
  "import-error",           # E0401

  # Pydocstyle
  "missing-module-docstring",   # C0114
  "missing-class-docstring",    # C0115
  "missing-function-docstring", # C0116
]

[tool.pylint.main]
jobs = 0
py-version = "3.12"
ignore-paths = [
  "^\\.direnv/.*$",
  "^\\.eggs/.*$",
  "^build/.*$",
  "^dist/.*$",
  "^node_modules/.*$",
  "^venv/.*$",
  "^\\.venv/.*$",
  "^site-packages/.*$",
  "^\\.mypy_cache/.*$",
  "^\\.ruff_cache/.*$",
  "^\\.pytest_cache/.*$",
  "^\\.git/.*$",
  "^_build/.*$",
  "^buck-out/.*$",
  "^__pypackages__/.*$",
]

[tool.pylint.format]
max-line-length = 88
